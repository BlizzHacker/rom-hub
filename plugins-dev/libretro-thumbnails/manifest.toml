[plugin]
slug        = "libretro-thumbnails"
name        = "libretro Thumbnails"
version     = "0.2.0"
rpp_version = "1"
license     = "MIT"

[capabilities]
metadata = "libretro_thumbnails.metadata:Metadata"

# One host, and only one: thumbnails.libretro.com serves the images
# directly with no redirect (verified 2026-07-29 -- `curl -w %{num_redirects}`
# reports 0 for a real boxart URL), so there is no CDN hop to declare and
# nothing else to allow.
[permissions]
network  = ["thumbnails.libretro.com"]
romm_api = []

[config]
# The image sets to try, best first. Box art is what RomM shows as a
# cover; the two after it are what exists for the games that never had a
# box -- arcade boards, and a great deal of every computer platform.
art_kinds      = { type = "list[str]", default = ["boxart", "title", "snap"] }

# Still honoured, and still means "only this one". Set it when you want a
# specific set and no fallback at all.
art_kind       = { type = "str", default = "" }

index_fallback = { type = "bool", default = true }
