[plugin]
slug        = "archive-org-torrent"
name        = "Archive.org (torrents)"
version     = "0.1.0"
rpp_version = "1"
license     = "MIT"

[capabilities]
torrent = "archive_org_torrent.torrent:Torrent"

# `archive.org` for /metadata/ and /download/; `*.archive.org` because a
# /download/ URL 302s to whichever node holds the item -- a live example is
# dn721909.ca.archive.org -- and the host re-checks every redirect hop. The
# same wildcard also covers the trackers these torrents announce to,
# bt1.archive.org and bt2.archive.org, which the host gates by hostname
# because a tracker is http or udp and therefore not something check_url
# can be asked about. Declaring them here is what makes them permitted.
[permissions]
network  = ["archive.org", "*.archive.org"]
romm_api = []

[config]
# What to name as wanted inside the torrent.
#
# An Archive.org item's torrent carries the payload alongside a thumbnail,
# a screenshot, a metadata XML and a sqlite index -- six files where one is
# the game. `true` names the payload, which is what `rom-hub torrent fetch`
# wants. `false` names nothing at all, which the host reads as "the whole
# torrent" and is the right answer for a handoff: the client fetches every
# file regardless, so pretending to select is theatre.
payload_only = { type = "bool", default = true }
