# Three disposable ROM library servers, for `scripts/proof_matrix.py`.
#
#     docker compose -p proofmatrix -f scripts/proof-stack.compose.yml up -d
#     ... run the matrix ...
#     docker compose -p proofmatrix -f scripts/proof-stack.compose.yml down -v
#
# Nothing here is meant to survive. Every credential below is a literal
# throwaway, every volume is anonymous and `down -v` removes all of it.
# **Do not point this at a library you care about**: the matrix uploads a
# ROM, writes metadata over it and leaves it there.
#
# Ports are deliberately not the defaults. RomM's is 8080 and Retrom's is
# 5101, and a matrix run that silently attached to somebody's real server
# would be both a data hazard and a fake result. If any of these collide
# on your host, change them here and pass the matching --*-url flags.
#
# Versions float on :latest for Gaseous and Retrom because neither
# publishes usable version tags; the matrix records the digest and the
# server-reported version it actually ran against, so a PROOF.md is still
# pinned to something specific after the fact.

name: proofmatrix

services:
  # -- RomM ---------------------------------------------------------------
  romm:
    image: rommapp/romm:4.9.2
    container_name: proofromm
    depends_on:
      romm-db:
        condition: service_healthy
      romm-redis:
        condition: service_started
    environment:
      - DB_HOST=proofromm-db
      - DB_NAME=romm
      - DB_USER=proof
      - DB_PASSWD=proof
      - REDIS_HOST=proofromm-redis
      # Throwaway. Regenerated by `down -v`, never reused.
      - ROMM_AUTH_SECRET_KEY=proofmatrixproofmatrixproofmatrix
      # No IGDB/SteamGridDB/ScreenScraper credentials on purpose. The
      # matrix proves the Hub's own writes land; a third-party metadata
      # provider would make the result depend on somebody else's uptime.
      - DISABLE_DOWNLOAD_ENDPOINT_AUTH=false
      - WEB_SERVER_CONCURRENCY=2
    ports: ["8085:8080"]
    volumes:
      - romm_library:/romm/library
      - romm_resources:/romm/resources
      - romm_assets:/romm/assets
      - romm_config:/romm/config

  romm-db:
    image: mariadb:11
    container_name: proofromm-db
    environment:
      - MARIADB_ROOT_PASSWORD=proofroot
      - MARIADB_DATABASE=romm
      - MARIADB_USER=proof
      - MARIADB_PASSWORD=proof
    volumes:
      - romm_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 20

  romm-redis:
    image: redis:alpine
    container_name: proofromm-redis

  # -- Gaseous ------------------------------------------------------------
  gaseous:
    image: ghcr.io/gaseous-project/gaseousserver:latest
    container_name: proofgaseous
    depends_on: [gaseous-db]
    ports: ["8086:80"]
    environment:
      - TZ=UTC
      - dbhost=proofgaseous-db
      - dbuser=root
      - dbpass=proof
      # Gaseous holds no platform metadata of its own -- it ingests it
      # from IGDB. With these empty it authenticates and accepts an upload
      # but knows of no platforms at all, so `platform_id("nes")` has
      # nothing to match and every row below it fails for a reason that is
      # this stack's configuration rather than the Hub's code. Supply your
      # own (free, from https://dev.twitch.tv) in a `.env` beside this
      # file. Ingestion takes a few minutes on first boot.
      - igdbclientid=${PROOF_IGDB_CLIENT_ID:-}
      - igdbclientsecret=${PROOF_IGDB_CLIENT_SECRET:-}
    volumes:
      # The image runs as root and keeps its data under /root, not
      # /home/gaseous; a volume at the latter persists nothing.
      - gaseous_data:/root/.gaseous-server

  gaseous-db:
    image: mariadb:11
    container_name: proofgaseous-db
    environment:
      - MARIADB_ROOT_PASSWORD=proof
    volumes:
      - gaseous_db:/var/lib/mysql

  # -- Retrom -------------------------------------------------------------
  #
  # Retrom has no accounts, so there is nothing to log in as.
  #
  # Two things about the library path are load-bearing, and getting either
  # wrong looks like a Hub bug when it is a deployment one:
  #
  # 1. The volume has to be where Retrom's *configured content directory*
  #    points. The stock config says `/app/library`; a volume anywhere else
  #    is simply not looked at, and `UpdateLibrary` answers INTERNAL "No
  #    library content found".
  # 2. Retrom has no upload API at all -- rom-hub files a ROM in over
  #    WebDAV, and Retrom's DAV handler is rooted at its *data* directory
  #    (`/app/data`). A content directory outside that tree is unreachable
  #    over `/dav`, which is precisely what `retrom/upload.py` refuses on
  #    rather than guessing.
  #
  # 3. The content directory's `storageType` decides where a ROM goes.
  #    `MULTI_FILE_GAME` (1), which is what Retrom writes into a fresh
  #    config.json, makes a *directory* the game -- so a `foo.zip` upload
  #    becomes a game whose `fs_name` is `foo`, and the import's
  #    post-condition (find our own filename or digest in the listing)
  #    cannot see it. `SINGLE_FILE_GAME` (0) is the layout the Retrom
  #    tests are written against and the one a ROM library actually wants.
  #
  # `RETROM_CONFIG__CONTENT_DIRECTORIES__*` does not override any of this
  # -- the service writes its own config.json at boot -- so
  # proof-stack-bootstrap.sh installs the file and restarts the container.
  # The volume goes straight to `/app/data/library`, which satisfies (1)
  # and (2) at once.
  #
  # Retrom derives a platform from a *directory* inside the content
  # directory and has no RPC that creates one, so proof-stack-bootstrap.sh
  # makes the directory and seeds one file before the first scan.
  retrom:
    image: ghcr.io/jmberesford/retrom-service:latest
    container_name: proofretrom
    depends_on: [retrom-db]
    ports: ["5102:5101"]
    environment:
      - RETROM_CONFIG__CONNECTION__DB_URL=postgres://retrom:retrom@proofretrom-db:5432/retrom
    volumes:
      - retrom_library:/app/data/library

  retrom-db:
    image: postgres:16-alpine
    container_name: proofretrom-db
    environment:
      - POSTGRES_USER=retrom
      - POSTGRES_PASSWORD=retrom
      - POSTGRES_DB=retrom
    volumes:
      - retrom_db:/var/lib/postgresql/data

volumes:
  romm_library:
  romm_resources:
  romm_assets:
  romm_config:
  romm_db:
  gaseous_data:
  gaseous_db:
  retrom_library:
  retrom_db:
