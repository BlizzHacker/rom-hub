---
Prince of Persia:
  files:
    "<base>/CONFIG.DAT":
      tags:
        - config
      when:
        - os: dos
    "<base>/PRINCE.SAV":
      tags:
        - save
      when:
        - os: dos
    "<base>/SETUP.DAT":
      tags:
        - config
      when:
        - os: dos
  id:
    lutris: prince-of-persia
Duke Nukem 3D:
  cloud:
    gog: true
  files:
    "<base>/DUKE3D.CFG":
      tags:
        - config
      when:
        - os: dos
    "<base>/GAME*.SAV":
      tags:
        - save
      when:
        - os: dos
  gog:
    id: 1207658730
  id:
    lutris: duke-nukem-3d
  installDir:
    Duke Nukem 3D: {}
  launch:
    "<base>/Dosbox/dosbox":
      - arguments: "-conf \"..\\DUKE3d.conf\" -noconsole -c"
        when:
          - os: linux
            store: steam
        workingDir: "<base>/Dosbox"
    "<base>/Duke Nukem 3D - DOS.bat":
      - when:
          - os: windows
            store: steam
    "<base>/Duke Nukem 3D.app":
      - when:
          - os: mac
            store: steam
    "<base>/Duke Nukem 3D/eduke32.exe":
      - when:
          - os: windows
            store: steam
        workingDir: "<base>/Duke Nukem 3D"
  steam:
    id: 359850
Fallout:
  cloud:
    epic: true
    gog: true
    steam: true
  files:
    "<base>/data/SAVEGAME":
      tags:
        - save
      when:
        - os: dos
        - os: windows
    "<base>/fallout.cfg":
      tags:
        - config
      when:
        - os: dos
        - os: windows
  gog:
    id: 1440166342
  id:
    gogExtra:
      - 1
      - 1440148836
    lutris: fallout
  installDir:
    Fallout: {}
  launch:
    "<base>/falloutlauncher.exe":
      - when:
          - os: windows
            store: steam
      - arguments: "-classic"
        when:
          - os: windows
            store: steam
  steam:
    id: 38400
