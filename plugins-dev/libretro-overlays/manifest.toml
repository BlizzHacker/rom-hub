[plugin]
slug        = "libretro-overlays"
name        = "libretro overlays (bezels and gamepads)"
version     = "0.2.0"
rpp_version = "1"
license     = "MIT"

[capabilities]
assets = "libretro_overlays.assets:Assets"

# Two hosts, and exactly two. `api.github.com` serves the Git Trees
# listing this plugin catalogues from; `raw.githubusercontent.com` serves
# both the .cfg this plugin reads at plan time and the files the host
# downloads. Neither redirects -- verified 2026-07-29 with
# `curl -w %{num_redirects}` against a real listing and a real overlay,
# which reports 0 for both -- so there is no CDN hop to declare.
#
# `raw.githubusercontent.com` is here for two different reasons at once:
# the plugin fetches an overlay's .cfg itself through `ctx.http` (to check
# it is self-contained), and the host fetches the same file plus its
# images from the FetchPlan. Both go through this one allowlist.
[permissions]
network  = ["api.github.com", "raw.githubusercontent.com"]
romm_api = []

[config]
# Narrow the catalogue to one top-level directory: "gamepads", "borders",
# "effects", "keyboards", "misc", "ctr", "ipad" or "wii". Empty means all
# of them, which is what you want unless the repository ever exceeds the
# 512 assets a plugin may return in one list.
section = { type = "str", default = "" }
