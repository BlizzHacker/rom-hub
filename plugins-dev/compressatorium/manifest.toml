[plugin]
slug        = "compressatorium"
name        = "Compressatorium (batch decompression)"
version     = "0.1.0"
rpp_version = "1"
license     = "MIT"

[capabilities]
cores = "compressatorium.cores:Cores"

[permissions]
network = [
  "api.github.com",
  "raw.githubusercontent.com",
]
romm_api = []

# ROMarr reads these to reach your Compressatorium container. The plugin
# itself never connects to it: ROM Hub plugins may only make HTTPS requests
# to the hosts listed above, and a sidecar on your LAN is not one of them.
[config]
url     = { type = "str",    default = "" }
api_key = { type = "secret" }
