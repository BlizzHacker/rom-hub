[plugin]
slug        = "retroachievements"
name        = "RetroAchievements"
version     = "0.3.0"
rpp_version = "1"
license     = "MIT"

[capabilities]
metadata = "retroachievements.metadata:Metadata"

# Still one host, and that is the notable part now that this plugin does
# propose artwork. `API_GetGame.php` returns box art as a *path*
# (`/Images/026365.png`), and both `retroachievements.org` and
# `media.retroachievements.org` serve it -- measured 2026-08-01, each
# answers 200 with `image/png` and identical 130,898 bytes, with no
# redirect. So the cover is named on the host already declared here for
# the API, and an operator who approved this plugin before covers existed
# does not have to approve a new host to get them.
[permissions]
network  = ["retroachievements.org"]
romm_api = []

# `api_key` is a `secret`. The type is implemented now (rom_hub.secrets),
# so the key is kept out of the Hub's plain config, redacted from every
# command's output, and handed to this plugin only in the `init` frame of
# the subprocess that needs it. Set it with:
#
#     rom-hub plugin secret set retroachievements api_key
#
# A secret carries NO `default` -- a manifest is a public file in a git
# repo, and the parser refuses one for exactly that reason. Anyone who set
# this as a plain `str` before is migrated automatically on next use; see
# the README.
[config]
api_key                = { type = "secret" }
username               = { type = "str", default = "" }
set_name               = { type = "bool", default = true }
only_with_achievements = { type = "bool", default = true }

# The achievement count, points, leaderboards and console, composed into
# RomM's `summary`. Free -- every one of these was already in the
# game-list response this plugin has always made.
summary                = { type = "bool", default = true }

# One extra `API_GetGame.php` call per enrich, for the publisher,
# developer, genre and release year -- and the box art URL. Turn it off to
# halve the request count over a large library; the summary then carries
# the game-list facts alone and no cover is proposed.
details                = { type = "bool", default = true }

# Propose RA's box art as the rom's cover. Needs `details`, which is where
# the URL comes from.
artwork                = { type = "bool", default = true }
