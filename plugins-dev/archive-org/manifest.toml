[plugin]
slug        = "archive-org"
name        = "Archive.org"
version     = "0.1.0"
rpp_version = "1"
license     = "MIT"

[capabilities]
search = "archive_org.search:Search"

[permissions]
network  = ["archive.org", "*.archive.org"]
romm_api = []

[config]
collections = { type = "list[str]", default = ["softwarelibrary"] }
