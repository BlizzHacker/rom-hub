[project]
name = "romm-hub"
version = "0.1.0"
description = "Plugin host for RomM (RPP v1)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyseccomp>=0.1.2; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
romm-hub = "romm_hub.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Resolve the package from THIS tree. Worktrees share site-packages, so a
# `pip install -e` in one silently repointed imports for the other.
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: hits the real network; deselected by default"]
addopts = "-m 'not live'"
