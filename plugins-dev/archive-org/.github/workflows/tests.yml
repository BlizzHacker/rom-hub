name: Plugin regression tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned ROM Hub SDK and test dependencies
        run: |
          git clone https://github.com/BlizzHacker/rom-hub.git /tmp/rom-hub
          git -C /tmp/rom-hub checkout f30123ff9113c2a8067e76e177a2405ca66561ab
          python -m pip install -e '/tmp/rom-hub[dev]'
      - name: Plugin regression suite
        run: python -m unittest discover -s tests -v
      - name: ROM Hub Archive.org compatibility suite
        run: |
          cd /tmp/rom-hub
          PYTHONPATH="$GITHUB_WORKSPACE:$PWD/src" python - <<'PY'
          import os
          import archive_org
          import pytest

          assert os.path.realpath(archive_org.__file__).startswith(
              os.path.realpath(os.environ["GITHUB_WORKSPACE"]) + os.sep
          ), archive_org.__file__
          raise SystemExit(pytest.main([
              "tests/test_archive_org.py",
              "tests/test_archive_org_clr.py",
              "tests/test_archive_org_importer.py",
              "tests/test_archive_org_metadata.py",
              "tests/test_archive_org_census.py",
              "-q",
          ]))
          PY
