[project]
name = "rom-hub"
version = "0.1.0"
description = "Plugin host for RomM (RPP v1)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyseccomp>=0.1.2; sys_platform == 'linux'",
    # Not optional, and not a nicety. RomM's chunked upload writes the file
    # to disk but creates no database row, and it exposes no REST endpoint
    # that registers it (`/api/tasks/run/scan_library` answers 400 "cannot
    # be run"). Its own web UI emits a socket.io "scan" event after every
    # upload; rom_hub.backends.romm.scan does the same. Without this, an imported
    # ROM never appears in the library. See src/rom_hub/backends/romm/scan.py.
    "python-socketio[client]>=5.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
rom-hub = "rom_hub.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Resolve the package from THIS tree. Worktrees share site-packages, so a
# `pip install -e` in one silently repointed imports for the other.
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: hits the real network; deselected by default"]
addopts = "-m 'not live'"

[tool.coverage.run]
branch = true
# The two shipped packages. `romm_hub` / `romm_hub_sdk` are three-line
# deprecation shims over these and are measured through `_compat`, so
# naming them here would inflate the number with re-exports.
source = ["rom_hub", "rom_hub_sdk"]
# `rom_hub_sdk.runner` is the plugin subprocess entry point. It is
# exercised heavily -- every broker test spawns it -- but in a *child*
# process whose environment is built from `{}` upward by
# `broker.host.plugin_environment`, so COVERAGE_PROCESS_START cannot be
# handed to it without punching a hole in the very allowlist
# tests/test_hostile_plugin.py exists to defend. Its coverage number is
# therefore an artefact of the sandbox, not a measure of testing; see
# docs/PROOF.md.

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
