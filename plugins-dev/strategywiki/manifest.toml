[plugin]
slug        = "strategywiki"
name        = "StrategyWiki Walkthroughs"
version     = "0.1.0"
rpp_version = "1"
license     = "MIT"

[capabilities]
search   = "strategywiki.search:Search"
importer = "strategywiki.importer:Importer"
stream   = "strategywiki.stream:Stream"

[permissions]
network  = ["strategywiki.org"]
romm_api = []

[config]
collection = { type = "str", default = "StrategyWiki Guides" }
