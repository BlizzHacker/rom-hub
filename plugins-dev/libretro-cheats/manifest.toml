[plugin]
slug        = "libretro-cheats"
name        = "libretro cheat files"
version     = "0.2.0"
rpp_version = "1"
license     = "MIT"

[capabilities]
assets = "libretro_cheats.assets:Assets"

# Two hosts, and exactly two. `api.github.com` serves the Git Trees
# listings this plugin catalogues from; `raw.githubusercontent.com` serves
# the .cht the host downloads. Neither redirects -- verified 2026-07-29
# with `curl -w %{num_redirects}` against a real listing and a real cheat
# file, which reports 0 for both -- so there is no CDN hop to declare and
# nothing else belongs here.
[permissions]
network  = ["api.github.com", "raw.githubusercontent.com"]
romm_api = []

[config]
# Which system directories under cht/ to offer. Required in practice:
# libretro-database holds tens of thousands of cheat files across 43
# systems, far over the 512 a plugin may return, so with none selected
# this plugin lists the systems that exist and asks you to choose. See
# libretro_cheats/assets.py.
systems = { type = "list[str]", default = [] }
# Keep only cheat files whose name contains this string, case-insensitive.
# The NES directory alone holds 2,265 files, so this is what makes a
# single large system usable.
match   = { type = "str", default = "" }
